openapi: 3.1.0
info:
  title: Enterprise Admin API
  version: 1.0.0
  description: Production API contract for the Enterprise Frontend reference application.
servers:
  - url: /api/v1
security:
  - sessionCookie: []
tags:
  - name: Auth
  - name: Dashboard
  - name: Profile
  - name: Users
  - name: Security
paths:
  /auth/login:
    get:
      operationId: initiateLogin
      tags: [Auth]
      security: []
      parameters:
        - $ref: '#/components/parameters/ReturnUrl'
      responses:
        '302':
          description: Redirects to the configured OIDC authorization endpoint.
          headers:
            Location:
              schema:
                type: string
                format: uri
        '400':
          $ref: '#/components/responses/BadRequest'
        default:
          $ref: '#/components/responses/Problem'
  /auth/callback:
    get:
      operationId: completeLogin
      tags: [Auth]
      security: []
      parameters:
        - name: code
          in: query
          required: true
          schema: { type: string }
        - name: state
          in: query
          required: true
          schema: { type: string }
      responses:
        '302':
          description: Redirects to the validated internal return URL after establishing the application session.
          headers:
            Location:
              schema:
                type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        default:
          $ref: '#/components/responses/Problem'
  /auth/session:
    get:
      operationId: getCurrentSession
      tags: [Auth]
      x-permissions: []
      responses:
        '200':
          description: Current authenticated session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        default:
          $ref: '#/components/responses/Problem'
  /auth/logout:
    post:
      operationId: logout
      tags: [Auth]
      x-permissions: [authenticated]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '204':
          description: Session invalidated and cookie cleared.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        default:
          $ref: '#/components/responses/Problem'
  /dashboard/summary:
    get:
      operationId: getDashboardSummary
      tags: [Dashboard]
      x-permissions: [dashboard.read]
      responses:
        '200':
          description: Current dashboard summary from backend data.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardSummary'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        default:
          $ref: '#/components/responses/Problem'
  /me/profile:
    get:
      operationId: getMyProfile
      tags: [Profile]
      x-permissions: [profile.read.self]
      responses:
        '200':
          description: Current user's profile.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        default:
          $ref: '#/components/responses/Problem'
    patch:
      operationId: updateMyProfile
      tags: [Profile]
      x-permissions: [profile.update.self]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateMyProfileRequest'
      responses:
        '200':
          description: Updated current user's profile.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '422':
          $ref: '#/components/responses/ValidationError'
        default:
          $ref: '#/components/responses/Problem'
  /users:
    get:
      operationId: listUsers
      tags: [Users]
      x-permissions: [users.read]
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/SearchQuery'
        - $ref: '#/components/parameters/UserStatusFilter'
        - $ref: '#/components/parameters/UserSortBy'
        - $ref: '#/components/parameters/SortDirection'
      responses:
        '200':
          description: Server-paginated user list.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
        default:
          $ref: '#/components/responses/Problem'
  /users/{userId}:
    parameters:
      - $ref: '#/components/parameters/UserId'
    get:
      operationId: getUser
      tags: [Users]
      x-permissions: [users.read]
      responses:
        '200':
          description: User detail.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/Problem'
    patch:
      operationId: updateUser
      tags: [Users]
      x-permissions: [users.update]
      parameters:
        - $ref: '#/components/parameters/IfMatchRequired'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserRequest'
      responses:
        '200':
          description: Updated user.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
        default:
          $ref: '#/components/responses/Problem'
  /security/sessions:
    get:
      operationId: listSecuritySessions
      tags: [Security]
      x-permissions: [security.sessions.read.self]
      responses:
        '200':
          description: Active sessions belonging to the current user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        default:
          $ref: '#/components/responses/Problem'
  /security/sessions/{sessionId}:
    parameters:
      - name: sessionId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    delete:
      operationId: revokeSecuritySession
      tags: [Security]
      x-permissions: [security.sessions.revoke.self]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '204':
          description: Session revoked.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        default:
          $ref: '#/components/responses/Problem'
  /security/sessions/revoke-others:
    post:
      operationId: revokeOtherSecuritySessions
      tags: [Security]
      x-permissions: [security.sessions.revoke.self]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '204':
          description: All other sessions for the current user were revoked.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        default:
          $ref: '#/components/responses/Problem'
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: enterprise_session
  parameters:
    ReturnUrl:
      name: returnUrl
      in: query
      required: true
      schema:
        type: string
        pattern: '^/(app|auth)(/[^?#]*)?$'
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      schema:
        type: string
        format: uuid
    IfMatch:
      name: If-Match
      in: header
      required: false
      schema:
        type: string
        minLength: 1
    IfMatchRequired:
      name: If-Match
      in: header
      required: true
      schema:
        type: string
        minLength: 1
    Page:
      name: page
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: pageSize
      in: query
      required: false
      schema:
        type: integer
        enum: [10, 25, 50, 100]
        default: 25
    SearchQuery:
      name: q
      in: query
      required: false
      schema:
        type: string
        maxLength: 200
        default: ''
    UserStatusFilter:
      name: status
      in: query
      required: false
      schema:
        type: string
        enum: [all, active, inactive, locked, pending]
        default: all
    UserSortBy:
      name: sortBy
      in: query
      required: false
      schema:
        type: string
        enum: [username, displayName, email, status, createdAt, updatedAt]
        default: createdAt
    SortDirection:
      name: sortDir
      in: query
      required: false
      schema:
        type: string
        enum: [asc, desc]
        default: desc
    UserId:
      name: userId
      in: path
      required: true
      schema:
        type: string
        format: uuid
  headers:
    ETag:
      description: Entity tag for optimistic concurrency control.
      schema:
        type: string
  responses:
    BadRequest:
      description: Invalid request syntax or transport-level parameter.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetails' }
    Unauthorized:
      description: Authentication is required or the session is invalid.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetails' }
    Forbidden:
      description: Authenticated subject is not authorized for the operation.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetails' }
    NotFound:
      description: Resource was not found.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetails' }
    Conflict:
      description: Business or idempotency conflict.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetails' }
    PreconditionFailed:
      description: ETag precondition failed.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetails' }
    ValidationError:
      description: Semantic validation failed.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetails' }
    RateLimited:
      description: Request rate limit exceeded.
      headers:
        Retry-After:
          schema:
            type: integer
            minimum: 1
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetails' }
    ServiceUnavailable:
      description: Service dependency is temporarily unavailable.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetails' }
    Problem:
      description: Unexpected API problem.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetails' }
  schemas:
    ProblemDetails:
      type: object
      required: [title, status, code, correlationId]
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type: string
        instance:
          type: string
          format: uri-reference
        code:
          type: string
          minLength: 1
        correlationId:
          type: string
          format: uuid
        errors:
          type: array
          items:
            $ref: '#/components/schemas/FieldError'
    FieldError:
      type: object
      required: [field, message, code]
      properties:
        field:
          type: string
          minLength: 1
        message:
          type: string
          minLength: 1
        code:
          type: string
          minLength: 1
    UserStatus:
      type: string
      enum: [active, inactive, locked, pending]
    CurrentUser:
      type: object
      required: [id, username, firstName, lastName, displayName, email, status]
      properties:
        id: { type: string, format: uuid }
        username: { type: string, minLength: 1, maxLength: 150 }
        firstName: { type: string, minLength: 1, maxLength: 100 }
        lastName: { type: string, minLength: 1, maxLength: 100 }
        displayName: { type: string, minLength: 1, maxLength: 200 }
        email: { type: string, format: email, maxLength: 320 }
        status: { $ref: '#/components/schemas/UserStatus' }
    SessionResponse:
      type: object
      required: [authenticated, user, roles, permissions, expiresAt]
      properties:
        authenticated: { type: boolean, const: true }
        user: { $ref: '#/components/schemas/CurrentUser' }
        roles:
          type: array
          items: { type: string }
        permissions:
          type: array
          items: { type: string }
        expiresAt: { type: string, format: date-time }
    User:
      type: object
      required: [id, username, firstName, lastName, displayName, email, status, roles, permissions, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        username: { type: string, minLength: 1, maxLength: 150 }
        firstName: { type: string, minLength: 1, maxLength: 100 }
        lastName: { type: string, minLength: 1, maxLength: 100 }
        displayName: { type: string, minLength: 1, maxLength: 200 }
        email: { type: string, format: email, maxLength: 320 }
        avatarUrl:
          anyOf:
            - { type: string, format: uri }
            - { type: 'null' }
        status: { $ref: '#/components/schemas/UserStatus' }
        roles:
          type: array
          minItems: 1
          uniqueItems: true
          items: { type: string }
        permissions:
          type: array
          uniqueItems: true
          items: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    UserProfile:
      type: object
      required: [userId, firstName, lastName, displayName, email, status, createdAt, updatedAt]
      properties:
        userId: { type: string, format: uuid }
        firstName: { type: string, minLength: 1, maxLength: 100 }
        lastName: { type: string, minLength: 1, maxLength: 100 }
        displayName: { type: string, minLength: 1, maxLength: 200 }
        email: { type: string, format: email, maxLength: 320 }
        status: { $ref: '#/components/schemas/UserStatus' }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    UpdateMyProfileRequest:
      type: object
      minProperties: 1
      properties:
        firstName: { type: string, minLength: 1, maxLength: 100 }
        lastName: { type: string, minLength: 1, maxLength: 100 }
        displayName: { type: string, minLength: 1, maxLength: 200 }
        email: { type: string, format: email, maxLength: 320 }
    UpdateUserRequest:
      type: object
      minProperties: 1
      properties:
        firstName: { type: string, minLength: 1, maxLength: 100 }
        lastName: { type: string, minLength: 1, maxLength: 100 }
        displayName: { type: string, minLength: 1, maxLength: 200 }
        email: { type: string, format: email, maxLength: 320 }
        status: { $ref: '#/components/schemas/UserStatus' }
        roles:
          type: array
          minItems: 1
          uniqueItems: true
          items: { type: string }
    UserListResponse:
      type: object
      required: [items, page, pageSize, totalCount, totalPages, hasNext, hasPrevious]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/User' }
        page: { type: integer, minimum: 1 }
        pageSize: { type: integer, enum: [10, 25, 50, 100] }
        totalCount: { type: integer, minimum: 0 }
        totalPages: { type: integer, minimum: 0 }
        hasNext: { type: boolean }
        hasPrevious: { type: boolean }
    DashboardSummary:
      type: object
      required: [generatedAt, users]
      properties:
        generatedAt: { type: string, format: date-time }
        users:
          type: object
          required: [total, active, inactive, locked, pending]
          properties:
            total: { type: integer, minimum: 0 }
            active: { type: integer, minimum: 0 }
            inactive: { type: integer, minimum: 0 }
            locked: { type: integer, minimum: 0 }
            pending: { type: integer, minimum: 0 }
    SessionInfo:
      type: object
      required: [id, createdAt, lastSeenAt, expiresAt, current]
      properties:
        id: { type: string, format: uuid }
        createdAt: { type: string, format: date-time }
        lastSeenAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
        current: { type: boolean }
        userAgent:
          anyOf:
            - { type: string, maxLength: 500 }
            - { type: 'null' }
        ipAddress:
          anyOf:
            - { type: string, maxLength: 64 }
            - { type: 'null' }
    SessionListResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/SessionInfo' }
